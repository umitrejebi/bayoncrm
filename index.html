<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayon CRM — Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<!-- PeerJS for Live Share functionality -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --forest:#123B26;
  --forest-2:#1B5B3A;
  --leaf:#2E9563;
  --leaf-light:#7FCBA3;
  --mint:#EEF7F1;
  --paper:#FFFFFF;
  --line:#DCE8E0;
  --ink:#122019;
  --slate:#5C6E64;
  --slate-soft:#8A9990;
  --gold:#C79A3D;
  --brick:#B04B32;
  --radius-card:18px;
  --radius-pill:999px;
  --radius-input:10px;
  font-size:16px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#132018; --mint:#0F1C15; --ink:#EAF3EC; --line:#25392E; --slate:#9FB2A7; --slate-soft:#6E8377; --forest:#0C2418;
  }
}
:root[data-theme="dark"]{
  --paper:#132018; --mint:#0F1C15; --ink:#EAF3EC; --line:#25392E; --slate:#9FB2A7; --slate-soft:#6E8377; --forest:#0C2418;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--mint);
  color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-t);
  padding-bottom:var(--safe-b);
}
.num, .money{ font-variant-numeric: tabular-nums; }
h1,h2,h3,.display{ font-family:'Fraunces',Georgia,serif; letter-spacing:-0.01em; }
button{ font-family:inherit; }
a{ color:inherit; }
img,svg{ max-width:100%; }
::selection{ background:var(--leaf-light); color:var(--forest); }

.icon{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

/* ---------- Login ---------- */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(1100px 500px at 15% -10%, rgba(47,149,96,.35), transparent 60%),
    radial-gradient(900px 600px at 100% 110%, rgba(199,154,61,.18), transparent 55%),
    linear-gradient(180deg,#0E2A1B,#123B26 55%,#0E2A1B);
}
.login-card{
  width:100%;
  max-width:920px;
  background:var(--paper);
  border-radius:24px;
  overflow:hidden;
  display:grid;
  grid-template-columns:1.1fr 1fr;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.45);
}
.login-brand{
  background:
    radial-gradient(500px 300px at 20% 0%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(160deg,#154A2E,#0D2718);
  color:#EFF7F1;
  padding:44px 38px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:420px;
}
.login-brand .mark{
  width:52px;height:52px;border-radius:12px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  padding:4px;
}
.login-brand .mark img{
  width:100%;height:100%;object-fit:contain;
}
.login-brand h1{ font-size:2.1rem; font-weight:600; line-height:1.15; margin:22px 0 10px; color:#fff;}
.login-brand p{ color:#BFDACB; line-height:1.6; margin:0; max-width:34ch; font-size:.95rem;}
.login-brand .quote{ border-top:1px solid rgba(255,255,255,.15); padding-top:16px; margin-top:24px; font-size:.85rem; color:#9FC2AE;}
.login-form{ padding:44px 38px; display:flex; flex-direction:column; justify-content:center; gap:16px;}
.login-form h2{ margin:0 0 2px; font-size:1.5rem; }
.login-form .sub{ color:var(--slate); margin:0 0 12px; font-size:.9rem;}
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:.78rem; font-weight:600; color:var(--slate); text-transform:none; }
.field input, .field select{
  border:1.5px solid var(--line);
  background:var(--mint);
  border-radius:var(--radius-input);
  padding:12px 13px;
  font-size:.98rem;
  color:var(--ink);
  outline:none;
  transition:border-color .15s;
  width:100%;
}
.field input:focus, .field select:focus{ border-color:var(--leaf); }
.btn{
  border:none; cursor:pointer; border-radius:var(--radius-pill);
  padding:12px 22px; font-weight:700; font-size:.92rem;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:linear-gradient(135deg,var(--forest-2),var(--leaf)); color:#fff; box-shadow:0 10px 24px -10px rgba(27,91,58,.55);}
.btn-primary:hover{ box-shadow:0 14px 28px -10px rgba(27,91,58,.65); }
.btn-ghost{ background:transparent; color:var(--forest-2); border:1.5px solid var(--line); }
.btn-ghost:hover{ border-color:var(--leaf); }
/* Accessible action controls on the dark Bayon theme. */
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .btn-ghost{color:#C5F1D8;border-color:#41634D;background:rgba(255,255,255,.055)}
 :root:not([data-theme="light"]) .btn-ghost:hover{color:#fff;background:rgba(127,203,163,.14)}
}
:root[data-theme="dark"] .btn-ghost{color:#C5F1D8;border-color:#41634D;background:rgba(255,255,255,.055)}
:root[data-theme="dark"] .btn-ghost:hover{color:#fff;background:rgba(127,203,163,.14)}

.btn-danger{ background:#FBEAE6; color:var(--brick); }
.btn-sm{ padding:8px 14px; font-size:.82rem; }
.btn-icon{ width:38px;height:38px;padding:0;border-radius:10px; background:var(--mint); color:var(--slate); display:inline-flex; align-items:center; justify-content:center;}
.btn-icon:hover{ color:var(--forest-2); background:#E3F1E9; }
.btn-block{ width:100%; }
.login-error{ background:#FBEAE6; color:var(--brick); padding:10px 13px; border-radius:10px; font-size:.85rem; display:none;}
.lang-switch-login{ position:absolute; top:22px; inset-inline-end:22px; display:flex; gap:4px; background:rgba(255,255,255,.12); padding:4px; border-radius:999px;}
.lang-switch-login button{ border:none; background:transparent; color:#EFF7F1; padding:5px 12px; border-radius:999px; font-size:.78rem; font-weight:700; cursor:pointer;}
.lang-switch-login button.active{ background:#fff; color:var(--forest); }

/* ---------- Shell ---------- */
#app-screen{ display:none; min-height:100vh; }
.shell{ display:flex; min-height:100vh; }
.sidebar{
  width:248px; flex-shrink:0; background:var(--forest);
  color:#DDEBE1; display:flex; flex-direction:column;
  padding:22px 14px; gap:4px;
  position:sticky; top:0; height:100vh;
  z-index: 100;
}
.sb-brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 22px; }
.sb-brand .mark{ 
  width:38px;height:38px;border-radius:10px; 
  background:#fff; 
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  padding:3px;
}
.sb-brand .mark img{ width:100%; height:100%; object-fit:contain; }
.sb-brand .name{ font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; color:#fff;}
.sb-brand .sub{ font-size:.68rem; color:#8FB6A0; letter-spacing:.03em;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px;
  color:#C4DBCC; text-decoration:none; font-size:.92rem; font-weight:600; cursor:pointer;
  border:none; background:transparent; width:100%; text-align:start;
}
.nav-item .icon{ opacity:.85; }
.nav-item:hover{ background:rgba(255,255,255,.06); color:#fff; }
.nav-item.active{ background:linear-gradient(135deg,var(--leaf-2,#2E9563),#237A50); color:#fff; box-shadow:0 8px 18px -8px rgba(0,0,0,.4);}
.nav-item .badge{ margin-inline-start:auto; background:var(--brick); color:#fff; font-size:.68rem; font-weight:800; padding:1px 7px; border-radius:999px;}
.sidebar-foot{ margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.08); }
.sb-user{ display:flex; align-items:center; gap:10px; padding:8px; }
.avatar{
  width:36px;height:36px;border-radius:10px; background:var(--leaf-light); color:#0C2418;
  display:flex;align-items:center;justify-content:center;font-weight:800; font-size:.85rem; flex-shrink:0;
}
.sb-user .who{ overflow:hidden; }
.sb-user .who .n{ color:#fff; font-size:.86rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sb-user .who .r{ color:#8FB6A0; font-size:.72rem; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:20; background:var(--forest); backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.12); padding:14px 26px; display:flex; align-items:center; gap:14px;
  color:#fff;
}
.topbar h1{ font-size:1.3rem; margin:0; font-weight:600; color:#fff; }
.topbar .spacer{ flex:1; }
.mobile-menu-btn{ display:none; background:rgba(255,255,255,.12); color:#fff; }
.mobile-menu-btn:hover{ background:rgba(255,255,255,.2); color:#fff; }
.mobile-backdrop{ display:none; }

.lang-switch{ display:flex; gap:3px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.15); padding:3px; border-radius:999px;}
.lang-switch button{ border:none; background:transparent; padding:5px 11px; border-radius:999px; font-size:.75rem; font-weight:700; color:#DDEBE1; cursor:pointer;}
.lang-switch button.active{ background:#fff; color:var(--forest); }
.content{ padding:24px 26px 40px; max-width:1180px; width:100%; margin:0 auto; }

/* ---------- Cards / generic ---------- */
.grid-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.stat-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-card); padding:18px 18px 16px; }
.stat-card .lbl{ font-size:.78rem; color:var(--slate); font-weight:600; margin-bottom:8px;}
.stat-card .val{ font-size:1.65rem; font-weight:800; font-family:'Fraunces',serif; }
.stat-card.accent{ background:linear-gradient(150deg,var(--forest-2),#0E2E1D); color:#fff; border:none;}
.stat-card.accent .lbl{ color:#AFD3BE; }
.stat-card.warn .val{ color:var(--brick); }
.stat-card .sub{ font-size:.74rem; color:var(--slate-soft); margin-top:4px;}

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-card); padding:20px; margin-bottom:20px;}
.panel-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.panel-head h3{ margin:0; font-size:1.08rem; font-weight:600; }
.panel-head .spacer{ flex:1; }

.course-bar-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.course-bar-row:last-child{ border-bottom:none; }
.course-dot{ width:10px;height:10px;border-radius:3px; flex-shrink:0; }
.course-bar-row .name{ width:150px; flex-shrink:0; font-weight:700; font-size:.88rem; }
.course-bar-track{ flex:1; height:8px; background:var(--mint); border-radius:999px; overflow:hidden;}
.course-bar-fill{ height:100%; border-radius:999px; }
.course-bar-row .cnt{ width:80px; text-align:end; font-size:.82rem; color:var(--slate); font-weight:700;}

.toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.report-filters .chip-select{ min-width:140px; }
.search-wrap{ position:relative; flex:1; min-width:180px;}
.search-wrap .icon{ position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); color:var(--slate-soft);}
.search-wrap input{ width:100%; padding:10px 12px 10px 38px; border-radius:var(--radius-input); border:1.5px solid var(--line); background:var(--mint); font-size:.9rem; outline:none;}
.search-wrap input:focus{ border-color:var(--leaf); }
select.chip-select{ border:1.5px solid var(--line); background:var(--mint); border-radius:var(--radius-input); padding:9px 10px; font-size:.85rem; font-weight:600; color:var(--ink);}

table.tbl{ width:100%; border-collapse:collapse; font-size:.88rem;}
table.tbl th{ text-align:start; color:var(--slate); font-weight:700; font-size:.74rem; padding:0 12px 10px; border-bottom:1.5px solid var(--line);}
table.tbl td{ padding:12px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.tbl tr:last-child td{ border-bottom:none; }
table.tbl tbody tr{ cursor:pointer; transition:background .1s; }
table.tbl tbody tr:hover{ background:var(--mint); }
.tbl-wrap{ overflow-x:auto; }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:.72rem; font-weight:800; }
.pill.ok{ background:#E2F3E8; color:#1B7A45; }
.pill.debt{ background:#FBEAE6; color:var(--brick); }
.pill.ref{ background:#FBF1DC; color:#96721E; }

.student-name{ font-weight:700; }
.student-sub{ font-size:.76rem; color:var(--slate-soft); margin-top:1px; }
.name-cell{ display:flex; align-items:center; gap:10px; }

.empty-state{ text-align:center; padding:50px 20px; color:var(--slate); }
.empty-state .icon{ width:38px;height:38px; margin:0 auto 12px; color:var(--slate-soft);}
.empty-state h4{ margin:0 0 4px; color:var(--ink); font-family:'Fraunces',serif; font-weight:600; }
.empty-state p{ margin:0; font-size:.86rem; }

/* course cards */
.course-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.course-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px; position:relative; overflow:hidden;}
.course-card .bar{ position:absolute; top:0; inset-inline-start:0; width:5px; height:100%; }
.course-card h4{ margin:0 0 3px; font-family:'Fraunces',serif; font-size:1.1rem; padding-inline-start:8px;}
.course-card .price{ font-weight:800; color:var(--forest-2); padding-inline-start:8px; margin-bottom:10px; font-size:.95rem;}
.course-card .stats{ padding-inline-start:8px; display:flex; gap:16px; font-size:.78rem; color:var(--slate);}
.course-card .stats b{ display:block; color:var(--ink); font-size:1rem; }
.course-card .row-actions{ display:flex; gap:6px; margin-top:12px; padding-inline-start:8px;}

/* admin cards */
.admin-row{ display:flex; align-items:center; gap:12px; padding:13px 6px; border-bottom:1px solid var(--line);}
.admin-row:last-child{ border-bottom:none; }
.admin-row .who{ flex:1; min-width:0; }
.admin-row .who .n{ font-weight:700; font-size:.92rem;}
.admin-row .who .u{ font-size:.78rem; color:var(--slate); }

/* modal */
.overlay{ position:fixed; inset:0; background:rgba(12,32,20,.55); display:none; align-items:flex-start; justify-content:center; z-index:200; padding:26px 16px; overflow-y:auto;}
.overlay.show{ display:flex; }
.modal{ background:var(--paper); border-radius:20px; width:100%; max-width:540px; margin-top:20px; box-shadow:0 30px 60px -20px rgba(0,0,0,.4); animation:pop .16s ease;}
@keyframes pop{ from{ opacity:0; transform:translateY(6px) scale(.99);} to{opacity:1; transform:none;} }
.modal-head{ display:flex; align-items:center; gap:10px; padding:20px 22px 6px;}
.modal-head h3{ margin:0; flex:1; font-size:1.15rem; font-weight:600;}
.modal-body{ padding:14px 22px 22px; display:flex; flex-direction:column; gap:14px;}
.modal-foot{ padding:0 22px 22px; display:flex; gap:10px; justify-content:flex-end;}
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.divider-label{ font-size:.72rem; text-transform:none; font-weight:800; color:var(--slate-soft); display:flex; align-items:center; gap:8px; margin-top:4px;}
.divider-label::after{ content:''; flex:1; height:1px; background:var(--line);}
.hint{ font-size:.76rem; color:var(--slate-soft); }
.payments-list{ display:flex; flex-direction:column; gap:8px; max-height:230px; overflow-y:auto; padding-right:2px;}
.payment-row{ display:flex; align-items:center; gap:10px; background:var(--mint); border-radius:10px; padding:9px 11px; font-size:.85rem;}
.payment-row .amt{ font-weight:800; }
.payment-row .dt{ color:var(--slate); flex:1; }
.discount-banner{ background:#FBF1DC; color:#8A6A17; border-radius:10px; padding:10px 12px; font-size:.82rem; display:flex; gap:8px; align-items:flex-start;}

.toast-wrap{ position:fixed; bottom:24px; inset-inline-end:24px; z-index:300; display:flex; flex-direction:column; gap:10px; padding-bottom:var(--safe-b);}
.toast{ background:var(--ink); color:#F1F8F3; padding:12px 16px; border-radius:12px; font-size:.85rem; font-weight:600; box-shadow:0 10px 24px -8px rgba(0,0,0,.4); animation:toastin .18s ease; display:flex; align-items:center; gap:8px;}
.toast.err{ background:var(--brick); }
@keyframes toastin{ from{opacity:0; transform:translateY(8px);} to{opacity:1;transform:none;} }

.profile-card{ display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.profile-card .avatar{ width:56px;height:56px; border-radius:14px; font-size:1.2rem;}
.profile-card .n{ font-size:1.15rem; font-weight:700; font-family:'Fraunces',serif;}
.profile-card .r{ color:var(--slate); font-size:.85rem;}

/* Print styles */
@media print {
  .sidebar, .topbar, .print-no, .lang-switch-login { display: none !important; }
  .main { margin: 0; }
  body { background: #fff; }
}

/* Mobile drawer and responsive rules */
@media (max-width:960px){
  .grid-stats{ grid-template-columns:repeat(2,1fr); }
  .sidebar{ 
    position: fixed; 
    top: 0; 
    left: 0; 
    bottom: 0; 
    width: 260px; 
    z-index: 150; 
    background: var(--forest); 
    transform: translateX(-100%); 
    transition: transform .25s ease; 
    box-shadow: 4px 0 20px rgba(0,0,0,.3);
  }
  .sidebar.open{ transform: translateX(0); }
  .mobile-backdrop{
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 140; display: none;
  }
  .mobile-backdrop.show{ display: block; }
  .mobile-menu-btn{ display: inline-flex !important; }
  
  .content{ padding:18px 14px 40px; }
  .topbar{ padding:12px 16px; padding-top:calc(12px + var(--safe-t)); }
  .field-row{ grid-template-columns:1fr; }
  .login-card{ grid-template-columns:1fr; }
  .login-brand{ min-height:auto; padding:32px 26px;}
  .login-form{ padding:32px 26px; }
  .course-grid{ grid-template-columns:1fr 1fr; }
}
@media (max-width:520px){
  .grid-stats{ grid-template-columns:1fr 1fr; }
  .course-grid{ grid-template-columns:1fr; }
  table.tbl th:nth-child(3), table.tbl td:nth-child(3){ display:none; }
}
</style>
</head>
<body>

<!-- SVG LOGO INLINE DATA SOURCE -->
<svg style="display:none;">
  <defs>
    <g id="photo_2026-09-23_23-06-24.jpg">
      <svg viewBox="0 0 500 500" width="100%" height="100%">
        <!-- Custom Bayon CRM Logo -->
        <rect width="100" height="100" rx="100" fill="#123B26"/>
        <path d="M 120 120 L 260 120 C 315 120 350 150 350 195 C 350 230 325 255 285 265 C 340 275 370 305 370 355 C 370 410 320 440 260 440 L 120 440 Z M 180 170 L 180 240 L 250 240 C 275 240 290 228 290 205 C 290 182 275 170 250 170 Z M 180 290 L 180 390 L 255 390 C 285 390 305 375 305 340 C 305 305 285 290 255 290 Z" fill="#2E9563"/>
        <path d="M 290 100 C 370 100 420 160 420 250 C 420 340 370 400 290 400" stroke="#C79A3D" stroke-width="24" fill="none" stroke-linecap="round"/>
        <circle cx="250" cy="250" r="220" stroke="#7FCBA3" stroke-width="12" fill="none"/>
        <path d="M 330 210 Q 370 180 390 220" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
      </svg>
    </g>
  </defs>
</svg>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="lang-switch-login" id="loginLangSwitch"></div>
  <div class="login-card">
    <div class="login-brand">
      <div>
        <div class="mark">
          <svg viewBox="0 0 500 500"><use href="#photo_2026-09-23_23-06-24.jpg"/></svg>
        </div>
        <h1 id="brandTitle">Bayon CRM</h1>
        <p id="brandDesc">Системаи идоракунии хонандагон ва пардохтҳо барои маркази омӯзишӣ.</p>
      </div>
      <div class="quote" id="brandQuote">«Забон дониш аст, дониш — тағйирот»</div>
    </div>
    <div class="login-form">
      <div>
        <h2 id="loginTitle">Хуш омадед</h2>
        <p class="sub" id="loginSub">Барои идома ба системаи худ ворид шавед</p>
      </div>
      <div class="login-error" id="loginError"></div>
      <div class="field">
        <label id="lblUsername">Email</label>
        <input id="inUsername" type="email" autocomplete="username" placeholder="Ному насаб">
      </div>
      <div class="field">
        <label id="lblPassword">Парол</label>
        <input id="inPassword" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="button" class="btn btn-primary btn-block" id="btnLogin" onclick="doLogin()">Ворид шудан</button>

const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let cloudVersion=null, cloudPending=false, cloudDirty=false, cloudBlocked=false, cloudSavedSnapshot=null, cloudSyncTimer=null;
function safeCloudData(){
  const copy=JSON.parse(JSON.stringify(DATA));
  delete copy.admins;delete copy.password;delete copy.session;
  return copy;
}
function cloudBanner(msg, fatal=false){
  let el=document.getElementById('bayon-cloud-banner');
  if(!el){el=document.createElement('div');el.id='bayon-cloud-banner';el.style.cssText='position:fixed;bottom:12px;right:12px;left:auto;z-index:1000;padding:5px 10px;max-width:min(340px,calc(100vw - 24px));border-radius:999px;background:#123b26;color:white;text-align:center;font:600 11px system-ui;box-shadow:0 2px 10px #0003;line-height:1.3;overflow-wrap:anywhere';document.body.appendChild(el)}
  el.textContent=msg;el.style.background=fatal?'#9e3024':'#123b26';
}
function cloudStop(message){cloudBlocked=true;cloudBanner(message,true);alert(message);}
async function cloudRead(){
 const {data,error}=await sb.from('bayon_data').select('data,version').eq('id','main').single();
 if(error)throw error;
 if(!data.data || !Array.isArray(data.data.students) || !Array.isArray(data.data.courses))throw Error('Cloud CRM data is missing. Your existing Chrome data is untouched.');
 return data;
}
async function cloudIdentity(){
 const {data:{user},error}=await sb.auth.getUser();if(error||!user)throw Error('Please sign in.');
 const {data:staff,error:staffErr}=await sb.from('bayon_staff').select('role').eq('user_id',user.id).single();
 if(staffErr||!staff)throw Error('This account is not authorized for Bayon CRM.');
 return {id:'sb_'+user.id,fullName:user.email,username:user.email,role:staff.role==='ceo'?'super':'admin'};
}
async function cloudEnter(){
 const who=await cloudIdentity();
 const row=await cloudRead();
 cloudVersion=row.version;
 DATA={...row.data,admins:[who]};
 if(!Array.isArray(DATA.expenses))DATA.expenses=[];
 if(!Array.isArray(DATA.materialCharges))DATA.materialCharges=[];
 if(!Array.isArray(DATA.materialPayments))DATA.materialPayments=[];
 if(!Array.isArray(DATA.referralLedger))DATA.referralLedger=[];
 cloudSavedSnapshot=JSON.stringify(safeCloudData());
 state.user=who;state.page='dashboard';cloudBlocked=false;cloudDirty=false;
 showApp();cloudBanner('☁ Bayon Cloud connected');
 if(cloudSyncTimer)clearInterval(cloudSyncTimer);
 cloudSyncTimer=setInterval(cloudPoll,12000);
}
async function cloudPoll(){
 if(!state.user||cloudPending||cloudDirty||cloudBlocked)return;
 try{
  const row=await cloudRead();
  if(row.version===cloudVersion)return;
  const who=state.user;DATA={...row.data,admins:[who]};cloudVersion=row.version;
  cloudSavedSnapshot=JSON.stringify(safeCloudData());
  renderApp();cloudBanner('☁ Updated from Supabase');
 }catch(e){cloudBanner('Cloud refresh failed: '+e.message,true)}
}
async function cloudFlush(){
 if(cloudPending||cloudBlocked||!state.user)return;
 cloudPending=true;
 try{
  while(cloudDirty && !cloudBlocked){
   cloudDirty=false;
   const snapshot=JSON.stringify(safeCloudData());
   if(snapshot===cloudSavedSnapshot)continue;
   const {data,error}=await sb.from('bayon_data').update({data:JSON.parse(snapshot)}).eq('id','main').eq('version',cloudVersion).select('version').maybeSingle();
   if(error)throw error;
   if(!data){cloudStop('SAVE CONFLICT: Another device changed the database. Stop editing here, export a backup, then reload to receive the latest cloud records.');break;}
   cloudVersion=data.version;cloudSavedSnapshot=snapshot;
   cloudBanner('☁ Saved to Supabase');
  }
 }catch(e){cloudStop('Cloud save failed: '+e.message+'. Do not close this tab; export a backup before reloading.');}
 finally{cloudPending=false}
}
window.addEventListener('beforeunload',e=>{if(cloudPending||cloudDirty){e.preventDefault();e.returnValue='Unsaved cloud changes';}});

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DATA = JSON.parse(raw); }
  }catch(e){}
  if(!DATA || !Array.isArray(DATA.admins)){
    DATA = defaultData();
    saveData();
  }
  // Preserve existing administrator credentials. Never overwrite saved passwords.
  // defaultData() supplies admin/Admin only for a brand-new database.
  if(!Array.isArray(DATA.courses)){
    DATA.courses = defaultData().courses;
  }
  if(!Array.isArray(DATA.materialCharges)) DATA.materialCharges=[];
  if(!Array.isArray(DATA.materialPayments)) DATA.materialPayments=[];
  if(!Array.isArray(DATA.expenses)){
    DATA.expenses = [];
  }
  if(!Array.isArray(DATA.materialCharges)) DATA.materialCharges=[];
  if(!Array.isArray(DATA.materialPayments)) DATA.materialPayments=[];
  if(DATA.referralPrice === undefined || DATA.referralPrice === null) {
    DATA.referralPrice = 50;
  }
  if(!Array.isArray(DATA.referralLedger)) DATA.referralLedger=[];
  if(Array.isArray(DATA.students)){
    DATA.students.forEach(s => {
      if(s.referredBy && (s.referralBonus === undefined || s.referralBonus === null)){
        s.referralBonus = 50;
      }
    });
  }
}

function bayonDownload(filename,contents,mime){
 const blob=new Blob([contents],{type:mime});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=filename;a.style.display='none';
 document.body.appendChild(a);
 a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
}
function bayonCsv(rows,filename){
 const csv='\\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\\r\\n');
 bayonDownload(filename,csv,'text/csv;charset=utf-8;');
}
function downloadBayonBackup(){
 bayonDownload('BAYON_TEST_BACKUP_'+todayISO()+'.json',JSON.stringify({exportedAt:new Date().toISOString(),storageKey:STORAGE_KEY,data:DATA},null,2),'application/json;charset=utf-8;');
}

/* ---------------- live share logic ---------------- */
let liveShare = {
  peer: null,
  connections: [],
  code: '',
  role: null, // 'host' or 'client'
  status: 'disconnected' // 'connecting', 'connected', 'disconnected'
};

function startLiveShareHost(){
  if(liveShare.peer) liveShare.peer.destroy();

  const code = 'BAYON-' + Math.floor(100000 + Math.random() * 900000);
  liveShare.code = code;
  liveShare.role = 'host';
  liveShare.status = 'connecting';
  renderApp();

  try {
    liveShare.peer = new Peer(code);
    liveShare.peer.on('open', (id) => {
      liveShare.status = 'connected';
      toast('Live Share оғоз ёфт! Коди шумо: ' + id);
      renderApp();
    });

    liveShare.peer.on('connection', (conn) => {
      liveShare.connections.push(conn);
      toast('Компютери нав пайваст шуд!');
      renderApp();

      conn.on('open', () => {
        conn.send({ type: 'SYNC_DATA', data: DATA });
      });

      // ХОНДАНИ МАЪЛУМОТ АЗ КОМПЮТЕРИ 2 (CLIENT)
      conn.on('data', (msg) => {
        if(msg && msg.type === 'SYNC_DATA' && msg.data){
          if(!confirm('Live Share: Replace this device data with incoming data? Export a backup first.')) return;
          downloadBayonBackup();
          DATA = msg.data;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch(e){}
          toast('Маълумот аз Компютери 2 қабул ва нав карда шуд!');
          renderApp();

          // Ба ҳамаи дигар компютерҳои пайвастшуда низ мефиристем
          liveShare.connections.forEach(c => {
            if(c !== conn && c.open){
              c.send({ type: 'SYNC_DATA', data: DATA });
            }
          });
        }
      });

      conn.on('close', () => {
        liveShare.connections = liveShare.connections.filter(c => c !== conn);
        renderApp();
      });
    });

    liveShare.peer.on('error', (err) => {
      console.error('Peer error:', err);
      toast('Хатогӣ дар эҷоди Live Share', 'err');
      stopLiveShare();
    });
  } catch(e) {
    console.error(e);
    toast('Хатогӣ дар пайвастшавӣ', 'err');
    stopLiveShare();
  }
}

function connectLiveShareClient(){
  const inputEl = document.getElementById('fLiveCode');
  const code = (inputEl ? inputEl.value : '').trim().toUpperCase();
  if(!code){
    toast('Лутфан кодро ворид кунед', 'err');
    return;
  }

  if(liveShare.peer) liveShare.peer.destroy();

  liveShare.role = 'client';
  liveShare.status = 'connecting';
  renderApp();

  try {
    liveShare.peer = new Peer();
    liveShare.peer.on('open', () => {
      const conn = liveShare.peer.connect(code);
      liveShare.connections = [conn];

      conn.on('open', () => {
        liveShare.status = 'connected';
        liveShare.code = code;
        toast('Бомуваффақият ба Компютери 1 пайваст шуд!');
        renderApp();
      });

      // ХОНДАНИ МАЪЛУМОТ АЗ КОМПЮТЕРИ 1 (HOST)
      conn.on('data', (msg) => {
        if(msg && msg.type === 'SYNC_DATA' && msg.data){
          if(!confirm('Live Share: Replace this device data with incoming data? Export a backup first.')) return;
          downloadBayonBackup();
          DATA = msg.data;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch(e){}
          toast('Маълумотҳо бомуваффақият нав карда шуданд!');
          renderApp();
        }
      });

      conn.on('close', () => {
        toast('Алоқа бо Компютери 1 қатъ шуд', 'err');
        stopLiveShare();
      });
    });

    liveShare.peer.on('error', (err) => {
      toast('Код пайдо нашуд ё алоқа номумкин аст', 'err');
      stopLiveShare();
    });
  } catch(e) {
    console.error(e);
    toast('Хатогӣ дар пайвастшавӣ', 'err');
    stopLiveShare();
  }
}

function stopLiveShare(){
  if(liveShare.peer){
    liveShare.peer.destroy();
  }
  liveShare = {
    peer: null,
    connections: [],
    code: '',
    role: null,
    status: 'disconnected'
  };
  toast('Live Share қатъ карда шуд');
  renderApp();
}

function broadcastLiveShareData(){
  if(liveShare.role === 'host' && liveShare.connections.length > 0){
    liveShare.connections.forEach(conn => {
      if(conn && conn.open){
        conn.send({ type: 'SYNC_DATA', data: DATA });
      }
    });
  } else if(liveShare.role === 'client' && liveShare.connections.length > 0){
    const conn = liveShare.connections[0];
    if(conn && conn.open){
      conn.send({ type: 'SYNC_DATA', data: DATA });
    }
  }
}

/* ---------------- helpers: business logic ---------------- */
function getCourse(id){ return DATA.courses.find(c=>c.id===id); }
function courseName(c){ if(!c) return ''; return state.uiLang==='ru' ? c.name_ru : c.name_tj; }
function getAdmin(id){ return DATA.admins.find(a=>a.id===id); }
// CEO / Super Admin alone may modify or delete recorded payments.
function isCEO(){ return !!state.user && state.user.role==='super'; }
function canManageRecordedPayments(){ return isCEO(); }

function referralsOf(studentId){ return DATA.students.filter(s=>s.referredBy===studentId); }

function totalReferralBonusEarned(id){ return referralEntries().filter(r=>r.referrerId===id && r.status==='earned').reduce((a,r)=>a+r.amount,0); }
function isActiveStudent(s){ return s.active!==false; }
function validISO(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d||'') && cycleDate(d,0)===d; }
function cycleDate(anchor, offset){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(anchor||'')) return null;
 const [y,m,day]=anchor.split('-').map(Number);
 const first=new Date(y,m-1+offset,1);
 const last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
 return [first.getFullYear(),String(first.getMonth()+1).padStart(2,'0'),String(Math.min(day,last)).padStart(2,'0')].join('-');
}
function paymentAnniversary(s){return s.reenrollmentDate||s.joinDate;}
function lastCycleDue(s,at=todayISO()){
 const anchor=paymentAnniversary(s); if(!validISO(anchor)||at<anchor)return null;
 const [y,m]=anchor.split('-').map(Number),[yy,mm]=at.split('-').map(Number);
 let off=(yy-y)*12+mm-m, due=cycleDate(anchor,off);
 return due>at?cycleDate(anchor,off-1):due;
}
function nextCycleDue(s,at=todayISO()){
 const anchor=paymentAnniversary(s); if(!validISO(anchor))return null;
 if(at<anchor)return anchor;
 const [y,m]=anchor.split('-').map(Number),[yy,mm]=at.split('-').map(Number);
 let off=(yy-y)*12+mm-m;return cycleDate(anchor,off)<=at?cycleDate(anchor,off+1):cycleDate(anchor,off);
}
function enrollmentPeriods(s){
 const original=s.joinDate||todayISO();
 const periods=[{start:original,end:null}];
 (s.enrollmentHistory||[]).forEach(e=>{
   if(e.inactiveAt||e.inactiveSince){ const last=periods[periods.length-1]; if(last)last.end=e.inactiveAt||e.inactiveSince; }
   if(e.reenrolledAt)periods.push({start:e.reenrolledAt,end:null});
 });
 if(s.active===false && s.inactiveSince) periods[periods.length-1].end=s.inactiveSince;
 // Older sandbox re-enrollments had no explicit inactivity event, but previousInactiveSince was saved.
 (s.enrollmentHistory||[]).forEach(e=>{if(e.reenrolledAt&&e.previousInactiveSince){const i=periods.findIndex(p=>p.start===e.reenrolledAt);if(i>0)periods[i-1].end=e.previousInactiveSince;}});
 return periods.filter(p=>validISO(p.start));
}
function cycleCharges(s,at=todayISO()){
 const charges=[];const fee=Math.max(0,Number(s.price)||0);
 enrollmentPeriods(s).forEach(period=>{
  const stop=period.end&&period.end<at?period.end:at;
  for(let i=0;i<600;i++){
   const due=cycleDate(period.start,i);
   if(!due||due>stop||(period.end&&due>=period.end))break;
   charges.push({date:due,amount:fee});
  }
 });
 return charges.sort((a,b)=>a.date.localeCompare(b.date));
}
function paymentsThrough(s,at=todayISO()){
 return (s.payments||[]).filter(p=>p.date<=at).reduce((a,p)=>a+Math.max(0,Number(p.amount)||0),0);
}
// A referral qualifies only once, when the referred student has a positive recorded payment.
// Existing legacy discountsUsed are treated as already-used credits, never rewarded again.
function referralEntries(){
 const manual=Array.isArray(DATA.referralLedger)?DATA.referralLedger:[];
 const entries=[];
 (DATA.students||[]).forEach(s=>{
  if(!s.referredBy)return;
  const first=(s.payments||[]).filter(p=>Number(p.amount)>0&&validISO(p.date)).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const amount=Math.max(0,Number(s.referralBonus??DATA.referralPrice??50));
  const entry=manual.find(r=>r.referredId===s.id);
  entries.push(entry||{id:'ref_'+s.id,referrerId:s.referredBy,referredId:s.id,date:first?first.date:s.joinDate,status:first?'earned':'pending',amount,paidCash:0});
 });
 manual.forEach(r=>{if(!entries.some(e=>e.referredId===r.referredId))entries.push(r);});
 return entries;
}
function creditTotals(s,at=todayISO()){
 const earned=referralEntries().filter(r=>r.referrerId===s.id&&r.status==='earned'&&r.date<=at).reduce((a,r)=>a+Math.max(0,Number(r.amount)||0),0);
 const cash=referralEntries().filter(r=>r.referrerId===s.id&&r.status==='earned'&&r.date<=at).reduce((a,r)=>a+Math.max(0,Number(r.paidCash)||0),0);
 const legacy=Object.entries(s.discountsUsed||{}).filter(([k])=>k<=monthKey(at)).reduce((a,[,v])=>a+Math.max(0,Number(v)||0),0);
 const available=Math.max(0,earned-cash);
 // Legacy applied discounts are included in total credits, not deducted again.
 return {earned,cash,legacy,available};
}
function accountStatus(s,at=todayISO()){
 const charges=cycleCharges(s,at), total=charges.reduce((a,c)=>a+c.amount,0);
 const paid=paymentsThrough(s,at),credits=creditTotals(s,at);
 const creditUsed=Math.min(Math.max(0,total-paid),credits.available);
 const remaining=Math.max(0,total-paid-creditUsed);
 const oldest=charges.find((c,i)=>{
  const preceding=charges.slice(0,i+1).reduce((a,x)=>a+x.amount,0);
  return preceding>paid+creditUsed+0.00001;
 });
 return {total,paid,creditUsed,remaining,oldestDue:oldest?oldest.date:null,creditRemaining:Math.max(0,credits.available-creditUsed),charges};
}
function studentStatus(s,mKey){
 const at=mKey ? (mKey===currentMonthKey()?todayISO():mKey+'-'+String(new Date(Number(mKey.slice(0,4)),Number(mKey.slice(5,7)),0).getDate()).padStart(2,'0')) :todayISO();
 const acct=accountStatus(s,at), m=mKey||currentMonthKey();
 const paid=(s.payments||[]).filter(p=>monthKey(p.date)===m).reduce((a,p)=>a+Number(p.amount||0),0);
 const monthCharges=acct.charges.filter(c=>monthKey(c.date)===m).reduce((a,c)=>a+c.amount,0);
 return {paid,discount:acct.creditUsed,due:monthCharges,remaining:acct.remaining,status:acct.remaining<=0?'paid':'debt',refCount:referralsOf(s.id).length,totalEarnedDiscount:creditTotals(s,at).earned,oldestDue:acct.oldestDue,creditRemaining:acct.creditRemaining};
}
// Outstanding tuition is allocated oldest-first, so debts from prior months
// remain visible in every later month until settled.
function outstandingCycles(s,at=todayISO()){
 const a=accountStatus(s,at);
 let covered=a.paid+a.creditUsed;
 return a.charges.map(c=>{
   const applied=Math.min(c.amount,Math.max(0,covered));
   covered=Math.max(0,covered-applied);
   return {date:c.date,amount:Math.max(0,c.amount-applied)};
 }).filter(c=>c.amount>0.00001);
}
function overdueMonthLabels(s,at=todayISO()){
 const periods=outstandingCycles(s,at);
 return periods.map(c=>fmtDate(c.date)+' — '+fmtMoney(c.amount)).join(' · ');
}
function overdueStudents(){
 const at=todayISO();return DATA.students.filter(s=>isActiveStudent(s)&&accountStatus(s,at).remaining>0&&accountStatus(s,at).oldestDue<=at);
}
function toggleStudentActive(id,event){
 if(event)event.stopPropagation();const s=DATA.students.find(x=>x.id===id);if(!s)return;
 s.enrollmentHistory=s.enrollmentHistory||[];
 if(isActiveStudent(s)){
  if(!isCEO()){toast(state.uiLang==='ru'?'Только CEO может деактивировать ученика':'Танҳо роҳбар метавонад хонандаро ғайрифаъол кунад','err');return;}
  if(!confirm(state.uiLang==='ru'?'Отметить ученика неактивным?':'Хонандаро ғайрифаъол кунед?'))return;
  const date=todayISO();s.enrollmentHistory.push({inactiveAt:date});s.inactiveSince=date;s.active=false;
 }else{
  const date=prompt(state.uiLang==='ru'?'Дата повторного зачисления (ГГГГ-ММ-ДД)':'Санаи бозгашт (YYYY-MM-DD)',todayISO());
  if(!validISO(date)||date>todayISO()){toast('Invalid date','err');return;}
  s.enrollmentHistory.push({reenrolledAt:date,previousInactiveSince:s.inactiveSince||null});s.reenrollmentDate=date;s.active=true;s.inactiveSince=null;
 }
 saveData();renderApp();
}
function fmtMoney(n){ return Number(n||0).toLocaleString('ru-RU') + ' ' + t('currency'); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  const mo = t('monthShort')[d.getMonth()];
  return d.getDate()+' '+mo+' '+d.getFullYear();
}
function initials(name){
  return (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

/* ---------------- toast ---------------- */
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err' ? ' err' : '');
  el.innerHTML = (type==='err' ? icon('alert') : icon('check')) + '<span>'+msg+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}

async function doLogin(){

 const password=document.getElementById('inPassword').value;
 const err=document.getElementById('loginError');
 const btn=document.getElementById('btnLogin');
 btn.disabled=true;err.style.display='none';
 try{
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)throw error;
  await cloudEnter();
  document.getElementById('inPassword').value='';
 }catch(e){console.error(e);err.style.display='block';err.textContent='Cloud login: '+e.message;await sb.auth.signOut().catch(()=>{});}
 finally{btn.disabled=false;}

async function doLogout(){

function toggleMobileSidebar(forceClose){
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sbBackdrop');
  if(!sidebar) return;
  if(forceClose === true){
    sidebar.classList.remove('open');
    if(backdrop) backdrop.classList.remove('show');
  } else {
    sidebar.classList.toggle('open');
    if(backdrop) backdrop.classList.toggle('show', sidebar.classList.contains('open'));
  }
}

  return {

    students:t('navStudents'),
    referrals:t('navReferrals'),

    profile:t('navProfile'),

  }[p] || '';

function renderApp(){
  if(!state.user) return;
  const freshUser = DATA.admins.find(a => a.id === state.user.id);
  if(freshUser){
    state.user = freshUser;
  } else {
    doLogout();
    return;
  }

  renderSidebar();
  const pt = document.getElementById('pageTitle');
  if(pt) pt.textContent = pageTitleFor(state.page);
  const c = document.getElementById('content');
  if(!c) return;

  if(state.page==='dashboard') c.innerHTML = renderDashboard();
  else if(state.page==='notifications') c.innerHTML = renderNotifications();
  else if(state.page==='students') c.innerHTML = renderStudents();
  else if(state.page==='materials') c.innerHTML = renderMaterials();
  else if(state.page==='referrals' && state.user.role==='super') c.innerHTML = renderReferrals();
  else if(state.page==='reports' && state.user.role==='super') c.innerHTML = renderReports();
  else if(state.page==='expenses' && state.user.role==='super') c.innerHTML = renderExpenses();
  else if(state.page==='courses' && state.user.role==='super') c.innerHTML = renderCourses();
  else if(state.page==='admins' && state.user.role==='super') c.innerHTML = renderAdmins();
  else if(state.page==='profile') c.innerHTML = renderProfile();
  else if(state.page==='liveshare') c.innerHTML = renderLiveShare();
  else c.innerHTML = renderDashboard();
}

function dashboardEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderDashboard(){
  const students=DATA.students||[], active=students.filter(isActiveStudent);
  const inactiveCount=students.length-active.length, at=todayISO(), m=currentMonthKey();
  const debtors=Array.from(new Map([...overdueStudents(),...active.filter(s=>matOverdueDebt(s.id)>0)].map(s=>[s.id,s])).values()), overdueIds=new Set(debtors.map(s=>s.id));
  const paidStudents=active.filter(s=>(s.payments||[]).some(p=>monthKey(p.date)===m && Number(p.amount)>0)).length;
  const revenue=students.reduce((a,s)=>a+(s.payments||[]).filter(p=>monthKey(p.date)===m).reduce((b,p)=>b+Number(p.amount||0),0),0);
  const materialRevenue=matMonthIncome(m);
  const materialDebt=matCharges().reduce((n,ch)=>n+matRemaining(ch),0);
  const expenses=(DATA.expenses||[]).filter(e=>monthKey(e.date)===m).reduce((a,e)=>a+Number(e.amount||0),0);
  const debt=debtors.reduce((a,s)=>a+accountStatus(s,at).remaining,0);
  const courseRows=(DATA.courses||[]).map(c=>({c,count:active.filter(s=>s.courseId===c.id).length})).sort((a,b)=>b.count-a.count);
  const maxCount=Math.max(1,...courseRows.map(r=>r.count));
  const ru=state.uiLang==='ru';
  const labels=ru?{active:'Активные ученики',inactive:'Неактивные ученики',paid:'Оплатили обучение',owe:'Имеют задолженность',fin:'Финансы за месяц',income:'Получено',expense:'Расходы',net:'Денежный остаток',debt:'Просроченная сумма',upcoming:'Предстоящие платежи — 7 дней',date:'Дата оплаты',amount:'К оплате',none:'Нет предстоящих платежей',trend:'Динамика учеников — 6 месяцев',month:'Месяц'}:{active:'Хонандагони фаъол',inactive:'Хонандагони ғайрифаъол',paid:'Ҳаққи таҳсил пардохт шуд',owe:'Хонандагони қарздор',fin:'Молияи моҳона',income:'Даромади воқеӣ',expense:'Хароҷот',net:'Бақияи нақдӣ',debt:'Қарзи муҳлатгузашта',upcoming:'Пардохтҳои 7 рӯзи оянда',date:'Санаи пардохт',amount:'Маблағ',none:'Пардохти наздик нест',trend:'Тағйирёбии шумораи хонандагон — 6 моҳ',month:'Моҳ'};
  const upcoming=active.map(s=>{
    const due=nextCycleDue(s,at), a=accountStatus(s,at);
    const advance=Math.max(0,a.paid+a.creditUsed-a.total);
    const availableCredits=Math.max(0,a.creditRemaining);
    const amount=Math.max(0,Number(s.price||0)-advance-availableCredits);
    return {s,due,amount};
  })
    .filter(x=>x.due && x.due>at && (new Date(x.due+'T12:00:00')-new Date(at+'T12:00:00'))/86400000<=7 && !overdueIds.has(x.s.id) && x.amount>0)
    .sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8);
  const months=Array.from({length:6},(_,i)=>{const d=new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1-5+i,1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0')].join('-');});
  // Historical counts use enrollment/inactivity events, never today's active flag alone.
  const trend=months.map(key=>{
    const last=new Date(Number(key.slice(0,4)),Number(key.slice(5,7)),0);
    const endDate=[last.getFullYear(),String(last.getMonth()+1).padStart(2,'0'),String(last.getDate()).padStart(2,'0')].join('-');
    return {month:key,count:students.filter(s=>enrollmentPeriods(s).some(p=>p.start<=endDate && (!p.end||p.end>endDate))).length};
  });
  const trendMax=Math.max(1,...trend.map(x=>x.count));
  const card=(label,val,cls='')=>`<div class="stat-card ${cls}"><div class="lbl">${label}</div><div class="val num">${val}</div></div>`;

      <div class="panel-head"><h3>${labels.fin}</h3><span class="badge">${m}</span></div>
      <div class="grid-stats" style="margin:12px 0 0">
        ${card(labels.income,fmtMoney(revenue+materialRevenue),'accent')}
        ${card(labels.expense,fmtMoney(expenses))}
        ${card(labels.net,fmtMoney(revenue+materialRevenue-expenses))}
        ${card(labels.debt,fmtMoney(debt+materialDebt),debt+materialDebt?'warn':'')}
      </div><div class="hint">${matL().tuition}: ${fmtMoney(revenue)} · ${matL().received}: ${fmtMoney(materialRevenue)} · ${matL().balance}: ${fmtMoney(materialDebt)}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>${t('quickDebtTitle')}</h3><div class="spacer"></div>${debtors.length?`<button class="btn btn-ghost btn-sm" onclick="goPage('students')">${t('viewAll')}${icon('arrowR')}</button>`:''}</div>
      ${debtors.length===0?`<div class="empty-state"><div class="icon">${icon('check')}</div><h4>${t('noDebtors')}</h4></div>`:`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('colName')}</th><th>${t('colCourse')}</th><th>${t('colPhone')}</th><th>${t('colDue')}</th></tr></thead><tbody>
      ${debtors.map(s=>{const c=getCourse(s.courseId),a=accountStatus(s,at);return `<tr onclick="openStudent('${s.id}')" style="cursor:pointer"><td>${dashboardEscape(s.fullName||'')}</td><td>${courseName(c)}</td><td>${dashboardEscape(s.parentPhone||'')}</td><td><span class="pill debt">${fmtMoney(a.remaining+matOverdueDebt(s.id))}</span><div style="font-size:.72rem;margin-top:4px;max-width:270px;white-space:normal;color:var(--brick);">${overdueMonthLabels(s)}</div></td></tr>`}).join('')}
      </tbody></table></div>`}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>${labels.upcoming}</h3></div>
      ${upcoming.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('colName')}</th><th>${labels.date}</th><th>${labels.amount}</th></tr></thead><tbody>
      ${upcoming.map(({s,due,amount})=>`<tr onclick="openStudent('${s.id}')" style="cursor:pointer"><td>${dashboardEscape(s.fullName||'')}</td><td>${fmtDate(due)}</td><td>${fmtMoney(amount)}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty-state"><p>${labels.none}</p></div>`}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>${t('breakdownTitle')}</h3></div>
      ${courseRows.map(r=>`<div class="course-bar-row"><span class="course-dot" style="background:${r.c.color}"></span><span class="name">${courseName(r.c)}</span><div class="course-bar-track"><div class="course-bar-fill" style="width:${r.count/maxCount*100}%;background:${r.c.color}"></div></div><span class="cnt">${r.count}${t('studentsCount')}</span></div>`).join('')||'<div class="empty-state"><p>—</p></div>'}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>${labels.trend}</h3></div>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;padding:12px 0">
      ${trend.map(x=>`<div style="text-align:center;min-width:0"><div class="num" style="font-weight:700;margin-bottom:5px">${x.count}</div><div style="height:110px;display:flex;align-items:end;justify-content:center;background:var(--paper);border-radius:8px"><div style="background:var(--forest-2);width:60%;height:${Math.max(3,x.count/trendMax*100)}%;border-radius:6px 6px 0 0"></div></div><div style="font-size:.72rem;margin-top:6px">${x.month.slice(5)}</div></div>`).join('')}
      </div>
      <div style="font-size:.75rem;opacity:.7;margin-top:8px">${ru?'Исторические данные могут быть неполными, если даты ухода ранее не сохранялись.':'Маълумоти таърихӣ метавонад нопурра бошад, агар санаҳои хориҷшавӣ қаблан сабт нашуда бошанд.'}</div>
    </div>
  `;
}

// Referral settlement reflects the reward to the referrer, NOT the referred student's tuition payment.
function referralSettlement(r){
 const referrer=DATA.students.find(s=>s.id===r.referrerId);
 const cash=Math.max(0,Number(r.paidCash)||0);
 const reward=Math.max(0,Number(r.amount)||0);
 if(cash>=reward-0.001)return 'cash';
 if(!referrer)return 'unpaid';
 // The accounting engine automatically applies available rewards to tuition.
 // Allocate that credit to individual referrals in date order for a truthful status.
 const applied=accountStatus(referrer).creditUsed;
 const eligible=referralEntries().filter(x=>x.referrerId===r.referrerId&&x.status==='earned')
  .sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.id).localeCompare(String(b.id)));
 let used=0;
 for(const x of eligible){
  const amount=Math.max(0,Number(x.amount)||0);
  const paid=Math.max(0,Number(x.paidCash)||0);
  const need=Math.max(0,amount-paid);
  const allocation=Math.min(need,Math.max(0,applied-used));
  used+=allocation;
  if(x.id===r.id)return allocation>=need-0.001?(cash>0?'partial':'tuition'):allocation>0||cash>0?'partial':'unpaid';
 }
 return 'unpaid';
}
function referralSettlementLabel(r){
 const status=referralSettlement(r),ru=state.uiLang==='ru';
 return status==='cash'?(ru?'Выплачено наличными':'Нақд пардохт шуд'):
 status==='tuition'?(ru?'Зачтено в оплату':'Аз ҳаққи таҳсил тарҳ шуд'):
 status==='partial'?(ru?'Частично зачтено':'Қисман тарҳ шуд'):
 (ru?'Не выплачено':'Пардохт нашудааст');
}

 if(state.user.role!=='super')return;

 else DATA.referralLedger.push({...r,paidCash:Number(r.amount)||0,paidDate:todayISO()});
 saveData();renderApp();
}

function filteredStudents(){
  const q = state.studentQuery.trim().toLowerCase();
  return DATA.students.filter(s=>{
    if(state.studentCourseFilter!=='all' && s.courseId!==state.studentCourseFilter) return false;
    const st = studentStatus(s).status;
    if(state.studentStatusFilter!=='all' && st!==state.studentStatusFilter) return false;
    if(q && !(s.fullName.toLowerCase().includes(q) || s.parentPhone.toLowerCase().includes(q))) return false;

  }).sort((a,b)=> {
    const statusOrder = Number(isActiveStudent(b)) - Number(isActiveStudent(a));

}

function matCharges(id){ensureMaterials();return DATA.materialCharges.filter(x=>!id||x.studentId===id);}
function matPayments(id){ensureMaterials();return DATA.materialPayments.filter(x=>!id||x.studentId===id);}
function matPaid(chargeId){return matPayments().filter(x=>x.chargeId===chargeId).reduce((n,x)=>n+Number(x.amount||0),0);}
function matRemaining(ch){return Math.max(0,Number(ch.amount||0)-matPaid(ch.id));}
function matDebt(studentId){return matCharges(studentId).reduce((n,ch)=>n+matRemaining(ch),0);}

  if(changingDate && newJoinDate!==s.joinDate){
    s.enrollmentDateEdits = s.enrollmentDateEdits || [];
    s.enrollmentDateEdits.push({oldDate:s.joinDate||null,newDate:newJoinDate,changedAt:new Date().toISOString()});

  if(!saveMaterialChargeFromForm(s.id,'fEdit',todayISO())) return;

function renderReports(){
  if(state.user.role !== 'super') return renderDashboard();

  const selectedMonth = reportFilters.month;
  const selectedCourse = reportFilters.courseId;
  const selectedStudent = reportFilters.studentId;

  let filtered = DATA.students.filter(s => {
    if(selectedCourse !== 'all' && s.courseId !== selectedCourse) return false;
    if(selectedStudent !== 'all' && s.id !== selectedStudent) return false;
    return true;
  });

  let totalIncome = 0;
  let totalRemainingDebt = 0;

  filtered.forEach(s => {
    const st = studentStatus(s, selectedMonth);
    totalIncome += st.paid;
    totalRemainingDebt += st.remaining;
  });

  const materialIds=new Set(filtered.map(s=>s.id));

 const conf=document.getElementById('fConfirmPass').value;
 if(newP.length<8){toast('Use at least 8 characters','err');return;}
 if(newP!==conf){toast(t('pwMismatch'),'err');return;}
 const {error}=await sb.auth.updateUser({password:newP});
 if(error){toast(error.message,'err');return;}
 toast(t('toastPasswordChanged'));renderApp();
}

/* ---------------- Init ---------------- */
window.addEventListener('DOMContentLoaded', async () => {
  DATA=defaultData();
  document.getElementById('inUsername').placeholder='Supabase email';
  document.getElementById('lblUsername').textContent='Supabase email';
  setInterval(()=>{if(state.user&&window.bayonLastDate!==todayISO()){window.bayonLastDate=todayISO();renderApp();}},60000);
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session)await cloudEnter();else showLogin();
  }catch(e){console.error(e);showLogin();cloudBanner('Cloud connection: '+e.message,true);}
});
</script>
